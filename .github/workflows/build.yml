
name: Build KENO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract KENO
        run: |
          mkdir project
          unzip -q KENO_Online_Prototype.zip -d project

      

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("project").rglob("*"):
              if p.is_file() and (p.name.endswith(".gradle") or p.name.endswith(".gradle.kts")):
                  s = p.read_text()
                  s = s.replace("VERSION_1_8", "VERSION_17")
                  s = s.replace('"1.8"', '"17"')
                  s = s.replace("'1.8'", "'17'")
                  p.write_text(s)

                  print(f"Checking {p}:")
                  for line in s.splitlines():
                      if any(x in line for x in ("sourceCompatibility", "targetCompatibility", "jvmTarget")):
                          print(line.strip())
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
